<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: http:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; connect-src 'self' https: http:;">
  <title>AM</title>
  <link rel="stylesheet" href="styles/global.css">
</head>
<body>

  <!-- Drag region -->
  <div class="drag-region"></div>

  <!-- macOS Traffic Lights — RIGHT side -->
  <div class="win-controls no-drag">
    <button class="win-dot win-close" id="btnClose" title="Close"></button>
    <button class="win-dot win-minimize" id="btnMinimize" title="Minimize"></button>
    <button class="win-dot win-maximize" id="btnMaximize" title="Maximize"></button>
  </div>

  <!-- Tab strip -->
  <div class="tab-strip" id="tabStrip"></div>

  <!-- URL display (clickable to edit) -->
  <div class="url-bar" id="urlBar">
    <span class="url-bar-text" id="urlBarText">New Tab</span>
  </div>
  <div class="url-edit-bar hidden" id="urlEditBar">
    <div class="url-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <input id="urlInput" class="url-input" data-i18n-placeholder="omnibox.placeholder" placeholder="Search or type URL" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <!-- Menu backdrop -->
  <div id="menu-backdrop" class="no-drag"></div>

  <!-- Side menu -->
  <div id="side-menu" class="no-drag">
    <div class="ph">
      <span class="logo-text">AM</span>
      <b data-i18n="app.name">AM</b>
      <span style="flex:1"></span>
      <button id="menu-close-btn" class="menu-close-btn">✕</button>
    </div>
    <div id="side-menu-grid"></div>
    <div id="side-menu-footer">
      <button id="menu-history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="history.title">History</span>
      </button>
      <button id="menu-bookmarks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span data-i18n="bookmarks.title">Bookmarks</span>
      </button>
      <button id="menu-downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span data-i18n="downloads.title">Downloads</span>
      </button>
      <button id="menu-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="settings.title">Settings</span>
      </button>
    </div>
  </div>

  <!-- Panel backdrop + panel -->
  <div id="panel-backdrop" class="no-drag"></div>
  <div id="panel" class="no-drag">
    <div class="ph">
      <button id="panel-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <b id="panel-title"></b>
      <span style="flex:1"></span>
      <input id="panel-search" class="search-input hidden" data-i18n-placeholder="history.searchPlaceholder" placeholder="Search..." />
      <button id="panel-action"></button>
    </div>
    <div id="panel-body"></div>
  </div>

  <!-- Home screen -->
  <div id="home">
    <div class="home-logo-text">AM</div>
    <div id="home-search-wrap">
      <div id="home-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="home-input" type="text" data-i18n-placeholder="home.searchPlaceholder" placeholder="Search or enter URL" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
