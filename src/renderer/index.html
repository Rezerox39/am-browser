<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: http:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; connect-src 'self' https: http:;">
  <title>AM</title>
  <link rel="stylesheet" href="styles/global.css">
</head>
<body>

  <!-- Drag region -->
  <div class="drag-region"></div>

  <!-- macOS Traffic Lights — LEFT side -->
  <div class="win-controls no-drag">
    <button class="win-dot win-close" id="btnClose" title="Close">
      <svg viewBox="0 0 8 8"><path d="M1.5 1.5l5 5M6.5 1.5l-5 5"/></svg>
    </button>
    <button class="win-dot win-minimize" id="btnMinimize" title="Minimize">
      <svg viewBox="0 0 8 8"><path d="M1.5 4h5"/></svg>
    </button>
    <button class="win-dot win-maximize" id="btnMaximize" title="Maximize">
      <svg viewBox="0 0 8 8"><path d="M1.5 1.5h5v5h-5z"/></svg>
    </button>
  </div>

  <!-- Tab strip -->
  <div class="tab-strip" id="tabStrip"></div>

  <!-- URL display (clickable to edit) -->
  <div class="url-bar" id="urlBar">
    <span class="url-bar-text" id="urlBarText">New Tab</span>
  </div>
  <div class="url-edit-bar hidden" id="urlEditBar">
    <div class="url-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <input id="urlInput" class="url-input" data-i18n-placeholder="omnibox.placeholder" placeholder="Search or type URL" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <!-- Home screen -->
  <div id="home">
    <div class="home-logo-text">AM</div>
    <div id="home-search-wrap">
      <div id="home-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="home-input" type="text" data-i18n-placeholder="home.searchPlaceholder" placeholder="Search or enter URL" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </div>

  <!-- Toast (created dynamically by app.js if needed) -->
  <script src="app.js"></script>
</body>
</html>
