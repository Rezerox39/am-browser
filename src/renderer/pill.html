<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>AM Nav</title>
  <link rel="stylesheet" href="styles/pill.css">
</head>
<body>
  <div class="pill no-drag" id="pill">
    <button class="nav-btn" id="pillBack" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-btn" id="pillForward" title="Forward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="nav-btn" id="pillHome" title="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <button class="nav-btn" id="pillTabs" title="New Tab">
      <span class="tab-count" id="pillTabCount">1</span>
    </button>
    <button class="nav-btn" id="pillMenu" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg>
    </button>
  </div>
  <script src="pill.js"></script>
</body>
</html>
