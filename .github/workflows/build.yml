name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: node scripts/check.js

      - name: Build portable exe
        run: npx electron-builder --win portable --config

      - name: Upload exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AM-*.exe
          draft: false
          generate_release_notes: true
